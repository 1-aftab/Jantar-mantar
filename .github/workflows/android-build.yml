name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-debug-apk:
    name: Build offline debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install dependencies exactly from lockfile
        run: npm ci
      - name: Build production web game
        run: npm run build
      - name: Sync web build into Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/protest-mayhem-gradle.log"
      - name: Publish clear Gradle failure diagnostic
        if: steps.gradle_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer Gradle's concise failure block; retain a short tail only if it is absent.
          excerpt="$(grep -i -E -A 22 -B 3 'FAILURE: Build failed|What went wrong|Execution failed|^\* Exception|^.*error:.*' "$RUNNER_TEMP/protest-mayhem-gradle.log" | tail -n 180)"
          if [ -z "$excerpt" ]; then excerpt="$(tail -n 180 "$RUNNER_TEMP/protest-mayhem-gradle.log")"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Android Gradle diagnostic' \
            -f head_sha="$GITHUB_SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f 'output[title]=Debug APK build failed' \
            --raw-field "output[summary]=\`\`\`text
          $excerpt
          \`\`\`"
          exit 1
      - name: Verify debug APK was created
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Protest-Mayhem-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
